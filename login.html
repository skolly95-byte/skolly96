<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign In — GGZone</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
<div id="toast-container"></div>

<div class="auth-section">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="../index.html" class="logo">
        <span class="logo-icon">🎮</span>
        <span class="logo-text">GGZone</span>
      </a>
    </div>

    <h1 class="auth-title">Welcome Back</h1>
    <p class="auth-sub">Sign in to access your orders, wishlist and more</p>

    <form class="auth-form" id="login-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap">
          <i class="fas fa-envelope"></i>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required autocomplete="email" />
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" style="display:flex; justify-content:space-between;">
          <span>Password</span>
          <a href="forgot-password.html" style="font-size:13px; color:var(--blue);">Forgot password?</a>
        </label>
        <div style="position:relative;">
          <div class="input-icon-wrap">
            <i class="fas fa-lock"></i>
            <input type="password" class="form-input" id="password" placeholder="••••••••" required autocomplete="current-password" />
          </div>
          <button type="button" class="pw-toggle" style="position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--text-muted); font-size:15px; background:none; border:none; cursor:pointer;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>

      <div style="display:flex; align-items:center; gap:10px; font-size:14px;">
        <input type="checkbox" id="remember" style="accent-color:var(--blue); width:16px; height:16px;" />
        <label for="remember" style="cursor:pointer; color:var(--text-muted);">Keep me signed in</label>
      </div>

      <button type="submit" class="btn btn-primary btn-lg w-full">
        <i class="fas fa-sign-in-alt"></i> Sign In
      </button>

      <div class="auth-divider"><span>or continue with</span></div>

      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost w-full" onclick="showToast('Google sign-in coming soon!','info')">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px;height:18px;" /> Google
        </button>
        <button type="button" class="btn btn-ghost w-full" onclick="showToast('Discord sign-in coming soon!','info')" style="color:#5865F2;">
          <i class="fab fa-discord"></i> Discord
        </button>
      </div>
    </form>

    <p class="auth-link" style="margin-top:20px;">
      Don't have an account? <a href="register.html">Create one free</a>
    </p>

    <div style="text-align:center; margin-top:24px; padding-top:20px; border-top:1px solid var(--border);">
      <div style="font-size:12px; color:var(--text-muted); margin-bottom:8px;">Demo credentials (any email + 6+ char password):</div>
      <div style="display:flex; gap:8px; justify-content:center; flex-wrap:wrap;">
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('email').value='user@ggzone.com';document.getElementById('password').value='password123'">User Login</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('email').value='admin@ggzone.com';document.getElementById('password').value='admin123'">Admin Login</button>
      </div>
    </div>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
