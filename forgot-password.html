<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Forgot Password — GGZone</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
<div id="toast-container"></div>
<div class="auth-section">
  <div class="auth-card">
    <div class="auth-logo">
      <a href="../index.html" class="logo"><span class="logo-icon">🎮</span><span class="logo-text">GGZone</span></a>
    </div>
    <div style="text-align:center; margin-bottom:28px;">
      <div style="width:64px;height:64px;border-radius:50%;background:rgba(59,130,246,0.12);border:1px solid rgba(59,130,246,0.3);display:flex;align-items:center;justify-content:center;margin:0 auto 16px;font-size:28px;">🔑</div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-sub">Enter your email and we'll send you a reset link</p>
    </div>
    <form class="auth-form" id="forgot-form">
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap"><i class="fas fa-envelope"></i>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required />
        </div>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
    </form>
    <p class="auth-link" style="margin-top:20px;"><a href="login.html"><i class="fas fa-arrow-left"></i> Back to Sign In</a></p>
  </div>
</div>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
