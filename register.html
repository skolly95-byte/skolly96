<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — GGZone</title>
  <link rel="stylesheet" href="../css/style.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" crossorigin="anonymous" />
</head>
<body>
<div id="toast-container"></div>

<div class="auth-section">
  <div class="auth-card" style="max-width:480px;">
    <div class="auth-logo">
      <a href="../index.html" class="logo"><span class="logo-icon">🎮</span><span class="logo-text">GGZone</span></a>
    </div>
    <h1 class="auth-title">Join GGZone</h1>
    <p class="auth-sub">Create your account and start gaming</p>

    <form class="auth-form" id="register-form">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <div class="input-icon-wrap"><i class="fas fa-user"></i>
          <input type="text" class="form-input" id="name" placeholder="Ahmed Hassan" required />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <div class="input-icon-wrap"><i class="fas fa-envelope"></i>
          <input type="email" class="form-input" id="email" placeholder="you@example.com" required />
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <div style="position:relative;">
          <div class="input-icon-wrap"><i class="fas fa-lock"></i>
            <input type="password" class="form-input" id="password" placeholder="Min. 6 characters" required />
          </div>
          <button type="button" class="pw-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;background:none;border:none;cursor:pointer;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div style="position:relative;">
          <div class="input-icon-wrap"><i class="fas fa-lock"></i>
            <input type="password" class="form-input" id="confirm-password" placeholder="Repeat password" required />
          </div>
          <button type="button" class="pw-toggle" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);color:var(--text-muted);font-size:15px;background:none;border:none;cursor:pointer;">
            <i class="fas fa-eye"></i>
          </button>
        </div>
      </div>
      <div style="display:flex; align-items:flex-start; gap:10px; font-size:13px; color:var(--text-muted);">
        <input type="checkbox" id="terms" style="accent-color:var(--blue);width:16px;height:16px;margin-top:2px;flex-shrink:0;" required />
        <label for="terms" style="cursor:pointer; line-height:1.5;">
          I agree to the <a href="#" style="color:var(--blue);">Terms of Service</a> and <a href="#" style="color:var(--blue);">Privacy Policy</a>
        </label>
      </div>
      <button type="submit" class="btn btn-primary btn-lg w-full">
        <i class="fas fa-user-plus"></i> Create Account
      </button>
      <div class="auth-divider"><span>or sign up with</span></div>
      <div style="display:flex; gap:10px;">
        <button type="button" class="btn btn-ghost w-full" onclick="showToast('Google sign-up coming soon!','info')">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" style="width:18px;height:18px;" /> Google
        </button>
        <button type="button" class="btn btn-ghost w-full" onclick="showToast('Discord sign-up coming soon!','info')" style="color:#5865F2;">
          <i class="fab fa-discord"></i> Discord
        </button>
      </div>
    </form>
    <p class="auth-link" style="margin-top:20px;">Already have an account? <a href="login.html">Sign in</a></p>
  </div>
</div>

<script src="../js/main.js"></script>
<script src="../js/cart.js"></script>
<script src="../js/auth.js"></script>
</body>
</html>
